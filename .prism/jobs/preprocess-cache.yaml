name: preprocess-cache
# CPU-only pre-build of the audio-screen valid-index filter cache. Run this
# once per cluster BEFORE the GPU screen so every screen item starts with an
# instant cache hit instead of a ~hours-long cold filter at dataset-init.
#
# No `gpus:` -> schedules on the CPU partition (fast queue), never competes
# with audio-screen for the contended GPU nodes. The .npy it writes
# (MIDIGPT_CACHE, path+size+params keyed, mtime-independent) is exactly what
# the screen's dataset-init looks up. See scripts/preprocess_cache.sh for why
# the filter params are held in lockstep with train_audio_screen.sh.
#
# Submit per cluster (cache is local to each cluster's /scratch):
#   prism submit preprocess-cache -C nibi -C fir -C rorqual -C narval
# (Keys are portable, so one run's .npy can alternatively be Globus-synced to
#  the others instead of re-filtering on each — but a CPU job is cheap enough
#  to just run everywhere.)
#
# distribute mode (not smart/race): the cache must be built ON every cluster,
# not raced to one winner — and distribute needs no cross-cluster coordination,
# so it works with the local state backend. One matrix item per cluster +
# max_per_cluster: 1 pins exactly one build onto each of the 4 targets
# (pigeonhole: 4 items, 4 clusters). The matrix value is just a readable label;
# preprocess_cache.sh takes no args.
script: bash /scratch/triana24/MIDI-GPT/worktree-audio-conditioning/scripts/preprocess_cache.sh

mode: distribute
matrix:
  max_per_cluster: 1
  values:
    - "nibi"
    - "fir"
    - "rorqual"
    - "narval"

resources:
  cpus: 16
  mem_per_cpu_gb: 4   # 16 x 4 = 64G; each parallel shard-probe reloads a ~211MB shard
  time: "04:00:00"

requires_files:
  - "MIDI-GPT/data/v2.0.0/train"
  - "MIDI-GPT/worktree-audio-conditioning/models/amber_encoder.json"
requires_imports:
  - symusic
  - midigpt
