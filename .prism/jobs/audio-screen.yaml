name: audio-screen
# Stage 1 of the audio-extractor research plan: short adapter_only screens
# across all 8 real audio extractors (transcription-class: yourmt3,
# muscriptor, mert, sheetsage2; embedding/latent-class: dac, muq,
# music2latent, same), same data/training-mode/step-budget held fixed, to
# rank extractors before committing a full training-mode x data sweep to
# the top 2-3. See scripts/train_audio_screen.sh for the per-name
# (venv, extractor, weights, model-size) lookup table -- matrix values are
# short names (not compound strings) so distribute mode's auto-generated
# per-item job labels (<name>-<value>) stay readable.
#
# Fixed MAX_STEPS=1500 (script default) is the fair unit here: all 8
# extractors are frozen, so this is an equal number of adapter gradient
# updates regardless of which extractor feeds it. Per-step FLOPs differ a
# lot across extractors (58M-param Music2Latent vs. 852M-param SAME-L) --
# mitigated by a generous, uniform wall-clock budget below rather than
# per-extractor sizing (distribute mode applies one resources: block to
# every matrix item; cheap extractors just finish early and exit).
script: bash /scratch/triana24/MIDI-GPT/worktree-audio-conditioning/scripts/train_audio_screen.sh
args: "{matrix}"

mode: distribute
matrix:
  # Spread the 8 items across clusters instead of letting one best-scored
  # cluster absorb all of them (which strands the whole batch if that
  # cluster's --test-only estimate goes stale). 2/cluster over the usable
  # fleet (narval a100 + fir/rorqual/trillium/nibi h100) = all 8 placed.
  max_per_cluster: 2
  values:
    - "yourmt3"
    - "muscriptor"
    - "mert"
    - "sheetsage2"
    - "dac"
    - "muq"
    - "music2latent"
    - "same"

resources:
  gpus: 1
  cpus: 12
  mem_per_cpu_gb: 6   # 12 x 6 = 72G total
  time: "03:00:00"

# Dependency closure — checked on every target cluster before scheduling
# (prism preflight / auto on submit). These are exactly the gaps that cost a
# day of discover-by-failure: the MIDI-GPT backbone, extractor weights, the
# Slakh render, and the base-venv extractor packages. Paths are $SCRATCH-relative.
requires_files:
  - "MIDI-GPT/runs/yellow_medium-20260621-115325/model_final.safetensors"  # backbone
  - "MIDI-GPT/hf_cache/yourmt3"
  - "MIDI-GPT/hf_cache/dac_44khz"
  - "MIDI-GPT/data/slakh2100/slakh2100_flac_redux/train"
  - "MIDI-GPT/data/v2.0.0/train"
  - "MIDI-GPT/worktree-audio-conditioning/soundfonts/FluidR3_GM.sf2"
requires_imports:          # checked in venv-audio-conditioning (the job's venv) + module env
  - lightning
  - muscriptor
  - music2latent
  - einops
requires_inodes: 120000    # the extracted Slakh + venvs are inode-heavy (1e6/user cap)
requires_space_gb: 130
# Extractors that load by HF hub repo id (not a local staged dir): sheetsage2
# (trust_remote_code, needs the full snapshot + its xlm-roberta tokenizer) and
# music2latent. Compute nodes are air-gapped, so these must be pre-cached on
# the login node — `prism fetch audio-screen` does that; the job then loads
# them offline (HF_HUB_OFFLINE, set in train_audio_screen.sh). The local-path
# extractors (mert/dac/muq/same/yourmt3/muscriptor) are covered by
# requires_files / pre-staged dirs, not here.
requires_hf_models:
  - "m-a-p/SheetSage2"
  - "FacebookAI/xlm-roberta-base"
  - "SonyCSLParis/music2latent"
