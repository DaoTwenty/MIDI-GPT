name: audio-screen-dryrun2
# Dry-run (MAX_STEPS=5) revalidation of the extractors that failed/never
# produced artifacts, now that the fixes are in: datasets 4.0 everywhere,
# in-venv transformers, HF offline + HF_HOME, real-VRAM batch sizing, python -u,
# durable JSON/stdout metrics, and exit-code propagation (so a failure shows as
# FAILED, not COMPLETED). yourmt3/muscriptor use venv-audio-conditioning; mert
# uses venv-mert-check — all fixed on every cluster.
script: bash /scratch/triana24/MIDI-GPT/worktree-audio-conditioning/scripts/train_audio_screen.sh
args: "{matrix}"
mode: distribute
matrix:
  max_per_cluster: 1
  values:
    - "yourmt3"
    - "muscriptor"
    - "mert"
resources:
  gpus: 1
  cpus: 12
  mem_per_cpu_gb: 6
  time: "00:40:00"
requires_files:
  - "MIDI-GPT/runs/yellow_medium-20260621-115325/model_final.safetensors"
  - "MIDI-GPT/data/v2.0.0/train"
  - "MIDI-GPT/data/slakh2100/slakh2100_flac_redux/train"
  - "MIDI-GPT/worktree-audio-conditioning/soundfonts/FluidR3_GM.sf2"
requires_inodes: 120000
requires_space_gb: 130
