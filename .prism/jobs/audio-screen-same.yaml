name: audio-screen-same
# same extractor only, pinned to fir. same's stack (torch==2.7.1,
# transformers>=5.8, hub>=1.7.1) can't coexist with the shared module/~.local
# torch 2.11, so it runs from venv-same-check-iso — an isolated venv (no
# --system-site-packages) built with same's exact pins + midigpt _core rebuilt
# against torch 2.7.1. That venv currently exists only on fir (heavy multi-GB
# build), hence the -C fir pin. Replicate the iso venv to other clusters for
# parity later if same ranks high enough to warrant a full sweep.
script: bash /scratch/triana24/MIDI-GPT/worktree-audio-conditioning/scripts/train_audio_screen.sh
args: "{matrix}"

mode: distribute
matrix:
  max_per_cluster: 1
  values:
    - "same"

resources:
  gpus: 1
  cpus: 12
  mem_per_cpu_gb: 6
  time: "11:59:00"   # SAME-L (852M) is the heaviest extractor; 1500 steps hit the 3h cap on an earlier full run

requires_files:
  - "MIDI-GPT/runs/yellow_medium-20260621-115325/model_final.safetensors"
  - "MIDI-GPT/data/v2.0.0/train"
  - "MIDI-GPT/data/slakh2100/slakh2100_flac_redux/train"
  - "MIDI-GPT/worktree-audio-conditioning/soundfonts/FluidR3_GM.sf2"
  - "MIDI-GPT/hf_cache/same-l"
  - "MIDI-GPT/venvs/venv-same-check-iso/bin/python"
requires_inodes: 120000
requires_space_gb: 130
